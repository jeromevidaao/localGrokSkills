name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate SKILL.md files and compile scripts
        run: python3 scripts/check_skills.py

      - name: Topic map + skill resolver tests
        run: python3 scripts/test_skill_memory.py
